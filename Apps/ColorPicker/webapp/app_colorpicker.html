<!doctype html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no"
  >

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="app_colorpicker.css">
</head>

<body>

<main id="app">

  <canvas id="colorSpace"></canvas>

  <div class="samples">
    <button class="sample" id="color1">
      <i></i>
      <span>#47E3AD</span>
    </button>

    <button class="sample selected" id="color2">
      <i></i>
      <span>#0033C1</span>
    </button>
  </div>

  <div class="zoom">
    <button>+</button>
    <button>−</button>
  </div>

  <button class="menu">☷</button>

  <div class="picker picker-1"></div>
  <div class="picker picker-2"></div>

</main>

<script src="app_colorpicker.js"></script>
</body>
</html>
