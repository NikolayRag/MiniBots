

<!DOCTYPE html>
<html>
  <head>

  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #222;
      color: white;
      font-family: sans-serif;
    }

    .pickers {
      display: flex;
      gap: 40px;
      margin-bottom: 40px;
    }

    .picker {
      width: 200px;
    }

    .gradient {
      width: 100%;
      height: 180px;
      border-radius: 16px;
      background: linear-gradient(
        90deg,
        #15caf2,
        #fb380e
      );
    }

    .values {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-family: monospace;
    }
  </style>


<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="iro.min.js"></script>
<script>

function CPNew(_el, _v){
return new iro.ColorPicker(_el, {
  width: 150,
  height: 10,
  handleRadius: 8,
  activeHandleRadius: 10,
  handleUrl: null,
  // handleUrl: "#test",
  handleOrigin: {y: 0, x: 0},
  colors: [_v],
  borderWidth: 1,
  borderColor: '#777',
  wheelLightness: true,
  layoutDirection: 'horizontal',
  layout: [
    {
      component: iro.ui.Box,
      options: {}
    },
    {
      component: iro.ui.Slider,
      options: {
        sliderType: 'hue'
      }
    },
    {
      component: iro.ui.Slider,
      options: {
        sliderType: 'red'
      }
    },
    {
      component: iro.ui.Slider,
      options: {
        sliderType: 'green'
      }
    },
    {
      component: iro.ui.Slider,
      options: {
        sliderType: 'blue'
      }
    },
  ]
});
};

</script>

  </head>
  <body>

  <div class="pickers">
    <div class="picker">
      <div id="picker1"></div>
    </div>

    <div class="picker">
      <div id="picker2"></div>
    </div>
  </div>

  <div id="gradient" class="gradient"></div>

  <div class="values">
    <span id="value1"></span>
    <span id="value2"></span>
  </div>

</body>

<script>
/*
	var inDataA = location.hash.split('?')[0].substr(1).split(',');

  CPNew('#color0', {r: inDataA[0], g: inDataA[2], b: inDataA[3]}),
  CPNew('#color1', {r: inDataA[1], g: inDataA[3], b: inDataA[5]}),
*/
const p = new URLSearchParams(location.search);

var c1 = p.get("c1") || "#000000";
var c2 = p.get("c2") || "#FFFFFF";


	var colorPickers = [
		CPNew('#picker1', c1),
		CPNew('#picker2', c2),
	];

    const gradient = document.querySelector("#gradient");
    const value1 = document.querySelector("#value1");
    const value2 = document.querySelector("#value2");

    function updateGradient() {
      const color1 = colorPickers[0].color.hexString;
      const color2 = colorPickers[1].color.hexString;

      gradient.style.background =
        `linear-gradient(90deg, ${color1}, ${color2})`;

      value1.textContent = color1;
      value2.textContent = color2;
    }

    setInterval(updateGradient, 20);
//    picker1.on("color:change", updateGradient);
//    picker2.on("color:change", updateGradient);

    updateGradient();

/////////

	Telegram.WebApp.MainButton.show();
	Telegram.WebApp.MainButton.enable();
	Telegram.WebApp.onEvent('mainButtonClicked', function(){
		var rgb0 = colorPickers[0].colors[0].rgb;
		var rgb1 = colorPickers[1].colors[0].rgb;
		Telegram.WebApp.sendData([rgb0.r, rgb1.r, rgb0.g, rgb1.g, rgb0.b, rgb1.b].join(',')); 
	});

</script>
</html>
